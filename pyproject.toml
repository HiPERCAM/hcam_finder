[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hcam_finder"
version = "1.4.0"
description = "Observation planning and finding charts for HiPerCAM"
readme = {file = "README.rst", content-type = "text/x-rst"}
authors = [
    {name = "Stuart Littlefair", email = "s.littlefair@shef.ac.uk"}
]
license = {text = "MIT license"}
keywords = ["hcam_finder"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.6"
dependencies = [
    "ginga>=4.0",
    "astropy",
    "six",
    "pillow",
    "configobj",
    "hcam_widgets>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/HiPERCAM/hcam_finder"
"Download URL" = "https://github.com/HiPERCAM/hcam_finder/archive/v1.3.10.tar.gz"

[tool.setuptools.packages.find]
where = ["."]
include = ["hcam_finder*"]

[tool.setuptools.package-data]
hcam_finder = ["data/*"]

[tool.setuptools]
script-files = ["scripts/hfinder", "scripts/ufinder", "scripts/usfinder"]
